<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c026d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con gradiente -->
  <rect width="128" height="128" fill="url(#grad)"/>
  
  <!-- Círculo blanco semitransparente -->
  <circle cx="64" cy="64" r="51.2" fill="#ffffff" opacity="0.2"/>
  
  <!-- Átomo: órbitas -->
  <g transform="translate(64, 64)">
    <ellipse cx="0" cy="0" rx="48" ry="15.36" 
             fill="none" stroke="#ffffff" stroke-width="3.84" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="48" ry="15.36" 
             fill="none" stroke="#ffffff" stroke-width="3.84" stroke-linecap="round"
             transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="48" ry="15.36" 
             fill="none" stroke="#ffffff" stroke-width="3.84" stroke-linecap="round"
             transform="rotate(120)"/>
  </g>
  
  <!-- Núcleo central -->
  <circle cx="64" cy="64" r="9.6" fill="#ffffff"/>
  
  <!-- Electrones -->
  <circle cx="112" cy="64" 
          r="7.68" fill="#fbbf24" stroke="#ffffff" stroke-width="1.92"/>
  <circle cx="40" cy="105.6" 
          r="7.68" fill="#fbbf24" stroke="#ffffff" stroke-width="1.92"/>
  <circle cx="40" cy="22.4" 
          r="7.68" fill="#fbbf24" stroke="#ffffff" stroke-width="1.92"/>
</svg>