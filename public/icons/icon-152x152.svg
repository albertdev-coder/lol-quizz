<svg xmlns="http://www.w3.org/2000/svg" width="152" height="152" viewBox="0 0 152 152">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c026d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con gradiente -->
  <rect width="152" height="152" fill="url(#grad)"/>
  
  <!-- Círculo blanco semitransparente -->
  <circle cx="76" cy="76" r="60.800000000000004" fill="#ffffff" opacity="0.2"/>
  
  <!-- Átomo: órbitas -->
  <g transform="translate(76, 76)">
    <ellipse cx="0" cy="0" rx="57" ry="18.24" 
             fill="none" stroke="#ffffff" stroke-width="4.56" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="57" ry="18.24" 
             fill="none" stroke="#ffffff" stroke-width="4.56" stroke-linecap="round"
             transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="57" ry="18.24" 
             fill="none" stroke="#ffffff" stroke-width="4.56" stroke-linecap="round"
             transform="rotate(120)"/>
  </g>
  
  <!-- Núcleo central -->
  <circle cx="76" cy="76" r="11.4" fill="#ffffff"/>
  
  <!-- Electrones -->
  <circle cx="133" cy="76" 
          r="9.12" fill="#fbbf24" stroke="#ffffff" stroke-width="2.28"/>
  <circle cx="47.5" cy="125.4" 
          r="9.12" fill="#fbbf24" stroke="#ffffff" stroke-width="2.28"/>
  <circle cx="47.5" cy="26.6" 
