<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c026d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con gradiente -->
  <rect width="192" height="192" fill="url(#grad)"/>
  
  <!-- Círculo blanco semitransparente -->
  <circle cx="96" cy="96" r="76.80000000000001" fill="#ffffff" opacity="0.2"/>
  
  <!-- Átomo: órbitas -->
  <g transform="translate(96, 96)">
    <ellipse cx="0" cy="0" rx="72" ry="23.04" 
             fill="none" stroke="#ffffff" stroke-width="5.76" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="72" ry="23.04" 
             fill="none" stroke="#ffffff" stroke-width="5.76" stroke-linecap="round"
             transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="72" ry="23.04" 
             fill="none" stroke="#ffffff" stroke-width="5.76" stroke-linecap="round"
             transform="rotate(120)"/>
  </g>
  
  <!-- Núcleo central -->
  <circle cx="96" cy="96" r="14.399999999999999" fill="#ffffff"/>
  
  <!-- Electrones -->
  <circle cx="168" cy="96" 
          r="11.52" fill="#fbbf24" stroke="#ffffff" stroke-width="2.88"/>
  <circle cx="60" cy="158.4" 
          r="11.52" fill="#fbbf24" stroke="#ffffff" stroke-width="2.88"/>
  <circle cx="60" cy="33.599999999999994" 
          r="11.52" fill="#fbbf24" stroke="#ffffff" stroke-width="2.88"/>
</svg>