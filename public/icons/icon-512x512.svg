<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c026d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con gradiente -->
  <rect width="512" height="512" fill="url(#grad)"/>
  
  <!-- Círculo blanco semitransparente -->
  <circle cx="256" cy="256" r="204.8" fill="#ffffff" opacity="0.2"/>
  
  <!-- Átomo: órbitas -->
  <g transform="translate(256, 256)">
    <ellipse cx="0" cy="0" rx="192" ry="61.44" 
             fill="none" stroke="#ffffff" stroke-width="15.36" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="192" ry="61.44" 
             fill="none" stroke="#ffffff" stroke-width="15.36" stroke-linecap="round"
             transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="192" ry="61.44" 
             fill="none" stroke="#ffffff" stroke-width="15.36" stroke-linecap="round"
             transform="rotate(120)"/>
  </g>
  
  <!-- Núcleo central -->
  <circle cx="256" cy="256" r="38.4" fill="#ffffff"/>
  
  <!-- Electrones -->
  <circle cx="448" cy="256" 
          r="30.72" fill="#fbbf24" stroke="#ffffff" stroke-width="7.68"/>
  <circle cx="160" cy="422.4" 
          r="30.72" fill="#fbbf24" stroke="#ffffff" stroke-width="7.68"/>
  <circle cx="160" cy="89.6" 
          r="30.72" fill="#fbbf24" stroke="#ffffff" stroke-width="7.68"/>
</svg>