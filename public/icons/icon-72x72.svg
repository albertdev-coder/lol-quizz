<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c026d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con gradiente -->
  <rect width="72" height="72" fill="url(#grad)"/>
  
  <!-- Círculo blanco semitransparente -->
  <circle cx="36" cy="36" r="28.8" fill="#ffffff" opacity="0.2"/>
  
  <!-- Átomo: órbitas -->
  <g transform="translate(36, 36)">
    <ellipse cx="0" cy="0" rx="27" ry="8.64" 
             fill="none" stroke="#ffffff" stroke-width="2.16" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="27" ry="8.64" 
             fill="none" stroke="#ffffff" stroke-width="2.16" stroke-linecap="round"
             transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="27" ry="8.64" 
             fill="none" stroke="#ffffff" stroke-width="2.16" stroke-linecap="round"
             transform="rotate(120)"/>
  </g>
  
  <!-- Núcleo central -->
  <circle cx="36" cy="36" r="5.3999999999999995" fill="#ffffff"/>
  
  <!-- Electrones -->
  <circle cx="63" cy="36" 
          r="4.32" fill="#fbbf24" stroke="#ffffff" stroke-width="1.08"/>
  <circle cx="22.5" cy="59.400000000000006" 
          r="4.32" fill="#fbbf24" stroke="#ffffff" stroke-width="1.08"/>
  <circle cx="22.5" cy="12.599999999999998" 
          r="4.32" fill="#fbbf24" stroke="#ffffff" stroke-width="1.08"/>
</svg>