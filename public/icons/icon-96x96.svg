<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c026d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con gradiente -->
  <rect width="96" height="96" fill="url(#grad)"/>
  
  <!-- Círculo blanco semitransparente -->
  <circle cx="48" cy="48" r="38.400000000000006" fill="#ffffff" opacity="0.2"/>
  
  <!-- Átomo: órbitas -->
  <g transform="translate(48, 48)">
    <ellipse cx="0" cy="0" rx="36" ry="11.52" 
             fill="none" stroke="#ffffff" stroke-width="2.88" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="36" ry="11.52" 
             fill="none" stroke="#ffffff" stroke-width="2.88" stroke-linecap="round"
             transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="36" ry="11.52" 
             fill="none" stroke="#ffffff" stroke-width="2.88" stroke-linecap="round"
             transform="rotate(120)"/>
  </g>
  
  <!-- Núcleo central -->
  <circle cx="48" cy="48" r="7.199999999999999" fill="#ffffff"/>
  
  <!-- Electrones -->
  <circle cx="84" cy="48" 
          r="5.76" fill="#fbbf24" stroke="#ffffff" stroke-width="1.44"/>
  <circle cx="30" cy="79.2" 
          r="5.76" fill="#fbbf24" stroke="#ffffff" stroke-width="1.44"/>
  <circle cx="30" cy="16.799999999999997" 
          r="5.76" fill="#fbbf24" stroke="#ffffff" stroke-width="1.44"/>
</svg>