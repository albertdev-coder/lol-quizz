<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c026d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con gradiente -->
  <rect width="144" height="144" fill="url(#grad)"/>
  
  <!-- Círculo blanco semitransparente -->
  <circle cx="72" cy="72" r="57.6" fill="#ffffff" opacity="0.2"/>
  
  <!-- Átomo: órbitas -->
  <g transform="translate(72, 72)">
    <ellipse cx="0" cy="0" rx="54" ry="17.28" 
             fill="none" stroke="#ffffff" stroke-width="4.32" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="54" ry="17.28" 
             fill="none" stroke="#ffffff" stroke-width="4.32" stroke-linecap="round"
             transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="54" ry="17.28" 
             fill="none" stroke="#ffffff" stroke-width="4.32" stroke-linecap="round"
             transform="rotate(120)"/>
  </g>
  
  <!-- Núcleo central -->
  <circle cx="72" cy="72" r="10.799999999999999" fill="#ffffff"/>
  
  <!-- Electrones -->
  <circle cx="126" cy="72" 
          r="8.64" fill="#fbbf24" stroke="#ffffff" stroke-width="2.16"/>
  <circle cx="45" cy="118.80000000000001" 
          r="8.64" fill="#fbbf24" stroke="#ffffff" stroke-width="2.16"/>
  <circle cx="45" cy="25.199999999999996" 
          r="8.64" fill="#fbbf24" stroke="#ffffff" stroke-width="2.16"/>
</svg>