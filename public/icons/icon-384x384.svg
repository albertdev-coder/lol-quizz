<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c026d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con gradiente -->
  <rect width="384" height="384" fill="url(#grad)"/>
  
  <!-- Círculo blanco semitransparente -->
  <circle cx="192" cy="192" r="153.60000000000002" fill="#ffffff" opacity="0.2"/>
  
  <!-- Átomo: órbitas -->
  <g transform="translate(192, 192)">
    <ellipse cx="0" cy="0" rx="144" ry="46.08" 
             fill="none" stroke="#ffffff" stroke-width="11.52" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="144" ry="46.08" 
             fill="none" stroke="#ffffff" stroke-width="11.52" stroke-linecap="round"
             transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="144" ry="46.08" 
             fill="none" stroke="#ffffff" stroke-width="11.52" stroke-linecap="round"
             transform="rotate(120)"/>
  </g>
  
  <!-- Núcleo central -->
  <circle cx="192" cy="192" r="28.799999999999997" fill="#ffffff"/>
  
  <!-- Electrones -->
  <circle cx="336" cy="192" 
          r="23.04" fill="#fbbf24" stroke="#ffffff" stroke-width="5.76"/>
  <circle cx="120" cy="316.8" 
          r="23.04" fill="#fbbf24" stroke="#ffffff" stroke-width="5.76"/>
  <circle cx="120" cy="67.19999999999999" 
          r="23.04" fill="#fbbf24" stroke="#ffffff" stroke-width="5.76"/>
</svg>